<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title"><title id="title">Mapa de tecnologías verificadas: interfaz, servicios, datos y entorno.</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#36535b" stroke-width=".6" opacity=".32"/></pattern></defs><rect width="600" height="850" rx="10" fill="#10262f"/><g font-family="Segoe UI,Arial,sans-serif" fill="#eff5f4"><text x="32" y="37" font-size="17" fill="#8bd8d0" >MAPA DE TECNOLOGÍAS / EVIDENCIA EN CÓDIGO PÚBLICO</text><path d="M300 210V615" stroke="#edb574" fill="none"/><rect x="32" y="70" width="536" height="150" rx="5" fill="#17333d" stroke="#36535b"/><text x="52" y="103" font-size="23" fill="#8bd8d0" >01 / INTERFAZ</text><text x="52" y="140" font-size="23" fill="#eff5f4" >HTML · CSS · JavaScript</text><text x="52" y="171" font-size="21" fill="#adbec2" >Interfaces web y consumo de APIs</text><rect x="32" y="245" width="536" height="150" rx="5" fill="#17333d" stroke="#36535b"/><text x="52" y="278" font-size="23" fill="#8bd8d0" >02 / SERVICIOS</text><text x="52" y="315" font-size="23" fill="#eff5f4" >Java · Spring Boot · Python · Flask</text><text x="52" y="346" font-size="21" fill="#adbec2" >REST · Spring Security · PHP / POO</text><rect x="32" y="420" width="536" height="150" rx="5" fill="#17333d" stroke="#36535b"/><text x="52" y="453" font-size="23" fill="#8bd8d0" >03 / DATOS</text><text x="52" y="490" font-size="23" fill="#eff5f4" >Oracle · MySQL · H2 · SQL</text><text x="52" y="521" font-size="21" fill="#adbec2" >JPA y consultas relacionales</text><rect x="32" y="595" width="536" height="150" rx="5" fill="#17333d" stroke="#36535b"/><text x="52" y="628" font-size="23" fill="#8bd8d0" >04 / ENTORNO</text><text x="52" y="665" font-size="23" fill="#eff5f4" >Git · GitHub · Maven · Docker</text><text x="52" y="696" font-size="21" fill="#adbec2" >Código, dependencias y contenedores</text><text x="32" y="805" font-size="19" fill="#adbec2" >Conexiones de conocimiento, sin niveles ni porcentajes.</text></g></svg>
